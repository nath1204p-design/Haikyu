<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>อยากให้ไฮคิวบล็อกไหม?</title>
<script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Prompt,sans-serif;overflow:hidden}.bg-heart{position:absolute;opacity:.2;animation:float 6s infinite ease-in-out;pointer-events:none}@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(15deg)}}.bounce{animation:bounce 2s infinite ease-in-out}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.smooth{transition:transform .25s cubic-bezier(.34,1.56,.64,1),left .2s ease,top .2s ease}.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}</style></head>
<body class="bg-pink-50 min-h-screen w-screen flex items-center justify-center p-4 relative">
<canvas id="canvas" class="confetti"></canvas><div class="bg-heart text-pink-300 text-4xl top-10 left-10">♥</div><div class="bg-heart text-pink-300 text-3xl bottom-12 left-1/4" style="animation-delay:1s">♥</div><div class="bg-heart text-pink-300 text-5xl top-1/4 right-10" style="animation-delay:2s">♥</div>
<main class="w-full max-w-sm bg-white rounded-3xl p-8 shadow-2xl border-4 border-white text-center relative z-10"><div id="question"><span class="inline-block px-3 py-1 bg-pink-100 text-pink-600 text-xs font-semibold rounded-full mb-3">✨ ถามจริงจริงนะ</span><div class="w-36 h-36 mb-4 mx-auto flex items-center justify-center bounce"><div class="text-8xl">🐱</div></div><h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-6 leading-snug">อยากให้ไฮคิว<br><span class="text-pink-600">บล็อกไหม?</span> 🤔</h1><div id="area" class="w-full flex items-center justify-center gap-3 relative min-h-[65px] my-2"><button id="block" onclick="block()" class="smooth py-3 px-6 bg-gradient-to-r from-pink-400 to-red-500 text-white text-lg font-bold rounded-2xl shadow-lg z-20">🚫 บล็อก</button><button id="no" class="smooth py-3 px-5 bg-gray-200 text-gray-600 font-medium rounded-2xl z-30 touch-none">ไม่บล็อก</button></div></div><div id="success" class="hidden flex-col items-center"><span class="inline-block px-3 py-1 bg-red-100 text-red-500 text-xs font-semibold rounded-full mb-3">🔒 โดนบล็อกเรียบร้อย!</span><div class="w-40 h-40 mb-4 mx-auto flex items-center justify-center text-8xl">🔒</div><h2 class="text-2xl font-bold text-pink-600 mb-2">ยินดีด้วย! คุณโดนไฮคิว<br>บล็อกแล้วเรียบร้อย! 🔒🎉</h2><p class="text-gray-600 text-sm font-medium mb-6 leading-relaxed">พยายามจะกด "ไม่บล็อก" เหรอ...<br>เสียใจด้วยนะ ไม่มีทางกดได้หรอก ฮ่าๆ! 😜✨</p><button onclick="resetApp()" class="py-2.5 px-6 bg-gray-200 text-gray-600 font-semibold text-sm rounded-xl">🔄 เล่นใหม่อีกรอบ</button></div></main>
<script>const no=document.getElementById('no'),yes=document.getElementById('block'),q=document.getElementById('question'),s=document.getElementById('success');let a=0;function escapeBtn(e){e&&e.preventDefault();a++;let ys=Math.min(1+a*.35,3.8),ns=Math.max(1-a*.12,.15);yes.style.transform=`scale(${ys})`;no.style.position='fixed';let w=no.offsetWidth,h=no.offsetHeight,p=25,maxX=Math.max(p,innerWidth-w*ns-p),maxY=Math.max(p,innerHeight-h*ns-p);no.style.left=Math.floor(p+Math.random()*(maxX-p))+'px';no.style.top=Math.floor(p+Math.random()*(maxY-p))+'px';no.style.transform=`scale(${ns})`;no.style.opacity=ns<=.3?.5:1}['mouseenter','touchstart','pointerdown','click'].forEach(x=>no.addEventListener(x,escapeBtn,{passive:false}));function block(){q.classList.add('hidden');s.classList.remove('hidden');s.classList.add('flex');confetti()}function resetApp(){a=0;yes.style.transform='scale(1)';no.style.position='static';no.style.transform='scale(1)';no.style.opacity=1;no.style.left='auto';no.style.top='auto';s.classList.add('hidden');s.classList.remove('flex');q.classList.remove('hidden')}function confetti(){let c=document.getElementById('canvas'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let ps=Array.from({length:80},()=>({x:c.width/2,y:c.height/2,s:Math.random()*12+8,vx:(Math.random()-.5)*14,vy:(Math.random()-.7)*16,o:1,r:Math.random()*6.28,rs:(Math.random()-.5)*.2}));(function f(){x.clearRect(0,0,c.width,c.height);let n=0;ps.forEach(p=>{if(p.o>0){n++;p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.r+=p.rs;p.o-=.012;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=p.o;x.font=p.s*1.8+'px serif';x.fillText('♥',0,0);x.restore()}});if(n)requestAnimationFrame(f)})()}addEventListener('resize',()=>{canvas.width=innerWidth;canvas.height=innerHeight})</script></body></html>
